        echo "Running backend test simulation..."
        sleep 3
        echo "Backend testing done ✅"

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./water2

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: './water2/package-lock.json'

    - name: Install frontend dependencies
      run: npm ci

    - name: Skip frontend build (disabled)
      run: echo "Skipping frontend build for now..."

  deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
